services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets_app
      POSTGRES_PASSWORD: local-compose-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets_app -d tickets"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai:
    build: ./Member3_AI_Backend_/Member3_AI_Backend
    mem_limit: 512m
    ports: ["8000:8000"]

  backend:
    build: ./member2_backend
    mem_limit: 512m
    depends_on:
      database: { condition: service_healthy }
      ai: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://tickets_app:local-compose-only@database:5432/tickets
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: local-compose-secret-not-for-deployment
      CORS_ORIGINS: http://127.0.0.1:8080,http://127.0.0.1:5173
    ports: ["8001:8001"]

volumes:
  postgres_data:
